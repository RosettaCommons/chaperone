name: Clean install
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/*
  install:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        artifact: [wheel, sdist]
    env:
      CHAPERONE_SITE: portable
      CHAPERONE_COMPUTE_BACKEND: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: dist
      - name: Install artifact and public dependencies in a fresh environment
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          python -m venv "$RUNNER_TEMP/install"
          "$RUNNER_TEMP/install/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/install/bin/python" -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          if [ "$ARTIFACT" = wheel ]; then
            "$RUNNER_TEMP/install/bin/python" -m pip install dist/*.whl
          else
            "$RUNNER_TEMP/install/bin/python" -m pip install dist/*.tar.gz
          fi
          "$RUNNER_TEMP/install/bin/python" -m pip check
      - name: Exercise installed package outside the source tree
        run: |
          cp .github/scripts/installed_smoke.py "$RUNNER_TEMP/installed_smoke.py"
          cd "$RUNNER_TEMP"
          unset PYTHONPATH
          install/bin/chaperone --help
          install/bin/chaperone list-blocks
          install/bin/python -I installed_smoke.py
      - name: CPU regression tests against installed package
        run: |
          "$RUNNER_TEMP/install/bin/python" -m pip install pytest setuptools
          "$RUNNER_TEMP/install/bin/python" -m pytest -o pythonpath= -q \
            tests/test_container_gpu_resources.py tests/test_container_portability.py \
            tests/test_site_settings.py tests/test_slurm_resources.py \
            tests/test_distribution.py tests/test_pdb_io.py tests/test_modal_backend.py \
            tests/blocks/test_mpnn.py tests/test_nanoparticle.py tests/test_example_ports.py
      - name: Run a CPU Docker container without NVIDIA support
        if: matrix.artifact == 'wheel'
        env:
          CHAPERONE_CONTAINER_BACKEND: docker
        run: |
          cd "$RUNNER_TEMP"
          install/bin/python - <<'PYCODE'
          import subprocess
          from chaperone.containers import Image
          command = Image("cpu_smoke").base_image("ubuntu:24.04").build_command("true")
          command = ["ubuntu:24.04" if arg == "${CONTAINER:cpu_smoke}" else arg for arg in command]
          assert "--gpus" not in command
          subprocess.run(command, check=True)
          PYCODE
