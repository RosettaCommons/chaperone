name: TestPyPI
on:
  workflow_dispatch:
  push:
    tags: ['testpypi-v*']
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/chaperone-pipelines/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
  verify-upload:
    needs: publish
    runs-on: ubuntu-latest
    env:
      CHAPERONE_SITE: portable
      CHAPERONE_COMPUTE_BACKEND: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Download only Chaperone from TestPyPI
        run: |
          python -m pip install --upgrade "pip>=26.2.2"
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          python -m pip download --no-deps --only-binary=:all: \
            --index-url https://test.pypi.org/simple/ \
            --dest "$RUNNER_TEMP/download" "chaperone-pipelines==$VERSION"
      - name: Install public dependencies and exercise uploaded wheel
        run: |
          python -m venv "$RUNNER_TEMP/verify"
          "$RUNNER_TEMP/verify/bin/python" -m pip install --upgrade "pip>=26.2.2"
          "$RUNNER_TEMP/verify/bin/python" -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          "$RUNNER_TEMP/verify/bin/python" -m pip install --index-url https://pypi.org/simple/ "$RUNNER_TEMP"/download/*.whl
          "$RUNNER_TEMP/verify/bin/python" -m pip check
          cp .github/scripts/installed_smoke.py "$RUNNER_TEMP/installed_smoke.py"
          cd "$RUNNER_TEMP"
          unset PYTHONPATH
          verify/bin/chaperone --help
          verify/bin/python -I installed_smoke.py
