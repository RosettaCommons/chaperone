[project]
name = "chaperone"
version = "1.5.0"
description = "Chaperone: a framework for protein design and benchmarking"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core scientific packages
    "numpy",
    "scipy",
    "pandas",

    # PyTorch (CPU-only)
    "torch",

    # Sequence tooling. Chaperone itself parses structures with biotite, but
    # agents reach for these reflexively, and a failed import costs several
    # turns to discover and work around. Cheap to ship.
    "biopython",
    "parasail",

    # Essential framework dependencies
    "pydantic",
    "pydantic-settings",
    "rich",
    "rootutils",
    "tqdm",
    "python-dotenv>=1.2.2",  # atomworks>=3 requires >=1.2.2
    "safetensors",

    # Orchestration
    "polars",
    "cloudpickle",
    "submitit",

    # Biochem packages
    "biotite",
    "atomworks[ml,catcif]>=3.0.1",  # [ml]: torch, numba, einops, beartype; [catcif]: parse() reads archive.catcif:id tags
    "einops",  # used directly; also declared by atomworks[ml]
    "peppr",
    "catcif-tools",  # concatenated CIF archive format used by handler.store()
    "parasail",
    "ml-collections",
    "plip",
    "openbabel",

    # CLI tools
    "absl-py",

    # Container building
    "hpccm",
]

[project.optional-dependencies]
cli = [
    # No additional dependencies for CLI beyond core
]
dev = [
    "pytest",
    "pytest-xdist",
    "ruff==0.6.2",
    "pre-commit==3.7.*",
    "ipython",
    "icecream",
    "ipdb",
    "wandb",
]
ligand = [
    # pH-aware ligand protonation — only needed when soft_ddg/generate_params
    # is called on a ligand lacking hydrogens AND no params_file is given.
    "dimorphite-dl",
]
plip = [
    # Protein-ligand interaction profiling (PLIPBlock).
    # Also requires OpenBabel (system/conda install: `conda install -c conda-forge openbabel`).
    "plip",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.26.0",
    "mkdocs-gen-files>=0.5.0",
    "mkdocs-literate-nav>=0.6.1",
]
notebook = [
    "matplotlib",
    "seaborn",
    "ipykernel",
    "jupytext",
    "papermill",
]
pyrosetta = [
    # Installs the helper that fetches PyRosetta into the active environment.
    # PyRosetta itself is distributed separately and may require credentials.
    "pyrosetta-installer",
]
rna = [
    # RNA motif-scaffolding benchmark metrics.
    # ViennaRNA -> rna_thermo (Boltzmann probability of a required pair set).
    # tmtools    -> tm_score (TM-align bindings, C3' anchors for nucleic acids).
    "ViennaRNA",
    "tmtools",
]
all = ["chaperone[cli,dev,docs,notebook,pyrosetta,rna]"]

[project.scripts]
chaperone = "chaperone_cli.main:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["blocks*", "chaperone*", "chaperone_cli*"]

[tool.setuptools.package-data]
chaperone = ["py.typed"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

# Pixi tasks
[tool.pixi.tasks]
docs = "mkdocs build"
test = "pytest tests/"
fmt = "ruff format . && ruff check --fix ."

[dependency-groups]
test = ["pytest"]

# Environments
[tool.pixi.environments]
default = { solve-group = "default" }
test = { features = ["test"], solve-group = "default" }

# Dev environment dependencies
# Note: Most dev tools (jupyter, ipython, pytest, etc.) are in the default environment
# Note: xxhash and inotify have been moved to default environment
# [tool.pixi.feature.dev.pypi-dependencies]

[tool.pixi.feature.test.tasks]
set = "export PYTHONPATH=\"$(pwd)/src\" && echo $PYTHONPATH"
# FIXME: test task is not working inside apptainer container
test = { depends-on = ["set"], cmd = "/usr/bin/apptainer exec --env PYTHONPATH=\"$PYTHONPATH:$PYTHONPATH\" /net/software/containers/users/anmittal/pipeline_september_10.sif pytest ./tests/test_fetch_pipeline_head.py" } # TODO: run through apptainer after adding cifutils to the container
run-apptainer-test = '/usr/bin/apptainer exec --nv --bind /projects/ml/frozen_pdb_copies/2024_12_11_ccd:/projects/ml/frozen_pdb_copies/2024_12_11_ccd,/home/yanjing:/home/yanjing,/home/jbutch/software:/home/jbutch/software,/home/jbutch:/home/jbutch,/home/odinz:/home/odinz,/home/rohith:/home/rohith --bind /usr/bin/pymol:/usr/bin/pymol --bind /usr/bin/sacct:/usr/bin/sacct --bind /usr/bin/squeue:/usr/bin/squeue --bind /usr/lib/libgfortran.so.4:/usr/lib/libgfortran.so.4 --bind /lib/x86_64-linux-gnu:/lib/x86_64-linux-gnu --bind /usr/lib64/ld-linux-x86-64.so.2:/usr/lib64/ld-linux-x86-64.so.2 --bind /lib/x86_64-linux-gnu/libc.so.6:/lib/x86_64-linux-gnu/libc.so.6 --slurm --env PYTHONPATH=\"\$PYTHONPATH:/software/lab/rf_diffusion_aa/rf_diffusion:/software/lab/rf_diffusion_aa:/home/anmittal/Code/protein-design-pipelines/exec/../src/pipelines:/home/anmittal/Code/protein-design-pipelines/exec/..:\"         /net/software/containers/users/jbutch/pipeline_aug_6.sif pytest'

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "fast: marks tests as fast (deselect with '-m \"not fast\"')",
    "gpu: marks tests as requiring GPU allocation (skipped by default)",
    "slow: marks tests as slow or requiring full pipeline execution (skipped by default)",
    "cluster: marks tests as requiring actual SLURM cluster resources (skipped by default)",
    "perf: marks performance-sensitive tests (RSS, latency thresholds; skipped by default — opt in with '-m perf')",
]
testpaths = ["tests"]
addopts = "-m 'not cluster and not gpu and not slow and not perf' --ignore=tests/outputs"

[tool.coverage.run]
source = ["chaperone", "blocks"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff.lint.per-file-ignores]
# Scientific port from C++ — ambiguous var names and intermediate debug vars are intentional
"src/blocks/metrics/py_contact_ms.py" = ["E741", "F841"]
# Third-party AF3 script — lambda and unused vars are upstream patterns
"src/blocks/scripts/run_alphafold_AF.py" = ["E731", "F841"]
