[project]
name = "chaperone-evals"
version = "0.1.0"
description = "Agent evaluation harness for Chaperone"
requires-python = ">=3.12"
dependencies = [
    "chaperone",
    "harbor==0.16.1",
    "markdown>=3.7",
    "python-dotenv>=1.2",
]

[project.optional-dependencies]
test = ["pytest>=8.4"]

# `chaperone` is the Chaperone checkout this directory lives in. Declaring it
# here, rather than as an extra of the root pyproject.toml, keeps the harness
# out of every file the agent bundle ships.
[tool.uv.sources]
chaperone = { path = "../..", editable = true }

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# Nothing to install: the controller runs from this directory.
[tool.setuptools]
packages = []
